services:
  lechoppe:
    build:
      context: .
    image: lechoppe-postgresql:latest
    container_name: lechoppe-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      UPLOAD_DIR: /app/.next/standalone/public/uploads/menu
    volumes:
      - uploads_data:/app/.next/standalone/public/uploads
    networks:
      - shared-db-network

  reservation-worker:
    image: lechoppe-postgresql:latest
    restart: unless-stopped
    command: ["node", "--experimental-strip-types", "lib/reservations/run.mjs"]
    env_file:
      - .env
    healthcheck:
      disable: true
    networks:
      - shared-db-network

networks:
  shared-db-network:
    name: shared-db-network
    external: true

volumes:
  uploads_data:
